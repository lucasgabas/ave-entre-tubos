name: Build APK - Ave Entre Tubos

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Renomear APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Ave-Entre-Tubos-3.0-teste.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Ave-Entre-Tubos-3.0-APK
          path: Ave-Entre-Tubos-3.0-teste.apk
